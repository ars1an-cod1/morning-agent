name: Morning agent

on:
  # Started by the Cloudflare Worker (worker/worker.js) every morning on time, or by /morning in Telegram.
  # GitHub's own `schedule:` was starting 9-10 hours late, so it is not used anymore.
  workflow_dispatch: # also runnable by hand: Actions tab → "Run workflow"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the agent
        run: python agent.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ORTUS_ICAL_URL: ${{ secrets.ORTUS_ICAL_URL }}
          MESSAGE_LANGUAGE: ${{ vars.MESSAGE_LANGUAGE || 'English' }}
          RTU_SEMESTER_PROGRAM_ID: ${{ secrets.RTU_SEMESTER_PROGRAM_ID }}
          DEADLINES_JSON: ${{ vars.DEADLINES_JSON }} # saved by the bookmarklet, encrypted (logs show only scrambled text)
          DEADLINES_KEY: ${{ secrets.DEADLINES_KEY }} # password that unlocks it
          WORKER_URL: ${{ secrets.WORKER_URL }} # Cloudflare Worker: gets classes + deadlines for the chat
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
